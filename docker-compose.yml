version: '3.8'

services:
  app:
    image: cosmtrek/air:v1.64.4
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "9090:8080"
    command: ["air"]
    environment:
      - ROUTER_PORT=8080
      - HASHING_ALGORITHM=murmur3
      - SHARDING_KEY=id_client
      - SHARD_01_URL=http://shard01:8080  
      - SHARD_02_URL=http://shard02:8080
      - SHARD_03_URL=http://shard03:8080
      - CB_FAILURE_THRESHOLD=10
      - CB_OPEN_TIMEOUT_SEC=30
      - CB_HALF_OPEN_SUCCESS_THRESHOLD=2
  shard01:
    image: fidelissauro/chip:v2
    ports:
      - "8081:8080"

  shard02:
    image: fidelissauro/chip:v2
    ports:
      - "8082:8080"

  shard03:
    image: fidelissauro/chip:v2
    ports:
      - "8083:8080"